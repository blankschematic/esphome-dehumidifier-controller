# =============================================================================
#  Dehumidifier Plug — SIMPLE / teaching version     (Sonoff S31 Lite, ESP8285)
# =============================================================================
#  A bare mains switch. Exposes ONE relay over a local, UNAUTHENTICATED REST
#  endpoint. The controller box POSTs to it (by IP — the controller can't do
#  mDNS):
#       POST http://<plug-ip>/switch/relay/turn_on
#       POST http://<plug-ip>/switch/relay/turn_off
#
#  Deliberately omitted (see dehumidifier-plug.yaml for all of it):
#    - compressor cool-off / minimum-off timer
#    - power-on delay after a power cut
#    - stale-command watchdog
#    - HTTP basic auth
#    - hold-off status sensors, force/bypass button
#
#  Everything below is one self-contained file on purpose — nothing to include.
#  Fill in secrets.yaml first (see secrets.yaml.example).
# =============================================================================
substitutions:
  esphome_name: dehumidifier-plug
  friendly_name: Dehumidifier Plug

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m

logger:

# No Home Assistant on this network. Without reboot_timeout: 0s the native API
# reboots the device every ~15 min because no client ever connects.
api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  # First boot / lost Wi-Fi: raise our own AP, then the captive portal
  # collects the real network credentials.
  ap:
    ssid: ${esphome_name}
    password: !secret fallback_ap_password

captive_portal:

# version 2 keeps the web UI assets in flash, so it works with no internet.
web_server:
  port: 80
  version: 2
  local: true

# S31 Lite GPIO map: relay = GPIO12, green LED = GPIO13 (inverted), button = GPIO0.
# restore_mode ALWAYS_OFF -> the dehumidifier stays off after any power cut.
# name MUST stay lowercase "relay": the REST path is /switch/<name> verbatim, and
# the controller POSTs to /switch/relay/turn_on|off.
switch:
  - platform: gpio
    name: "relay"
    id: relay
    pin: GPIO12
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: relay_led
    on_turn_off:
      - output.turn_off: relay_led

output:
  - platform: gpio
    id: relay_led
    pin:
      number: GPIO13
      inverted: true

binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.toggle: relay
