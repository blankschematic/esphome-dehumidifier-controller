# ESPHome package: "Plug" box hardware — Wi-Fi Sonoff S31 or S31 Lite (ESP8285).
#
# Works on both the full S31 and the S31 Lite (identical pinout). The full S31's
# CSE7766 power meter is simply left unconfigured — this project doesn't use
# power monitoring. See the README "Load and relay rating" section before
# switching a compressor with either one.
#
# [VERIFY] It must be a *Wi-Fi* model, not the Zigbee S31 / S31 Lite — the
#          Zigbee variant has no ESP chip and cannot be flashed.
# [VERIFY] Standard S31 / S31 Lite GPIO map:
#            Relay coil ....... GPIO12
#            Button ........... GPIO0   (INPUT_PULLUP, active-low)
#            Green/link LED ... GPIO13  (inverted)
#
# The physical relay is exposed here as `relay_gpio` with `internal: true` and
# `restore_mode: ALWAYS_OFF` (safe state on power-up). Nothing should command
# it directly except the template `switch` `relay` defined in
# dehumidifier-plug.yaml, whose turn_on_action runs the compressor cool-off
# gate first. The green LED tracks the *physical* relay.
#
# Example use:
#   substitutions:
#     esphome_name: dehumidifier-plug
#     friendly_name: Dehumidifier Plug
#   packages:
#     board:   !include packages/board-sonoff-s31-lite.yaml
#     network: !include packages/network.yaml

substitutions:
  model_name: "Sonoff S31 Lite"

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp01_1m
  # Needed for number/text restore_value across reboots.
  restore_from_flash: true

preferences:
  flash_write_interval: 1min

switch:
  - platform: gpio
    pin: GPIO12
    id: relay_gpio
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - output.turn_on: relay_led
    on_turn_off:
      - output.turn_off: relay_led

output:
  - platform: gpio
    id: relay_led
    pin:
      number: GPIO13
      inverted: true

binary_sensor:
  - platform: gpio
    name: "Button"
    id: on_board_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    # Toggle the *template* relay so the button obeys the cool-off gate too.
    on_press:
      - switch.toggle: relay
