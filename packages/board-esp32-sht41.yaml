# ESPHome package: "Controller" box hardware — Wemos/LOLIN ESP32 + Sensirion
# SHT41 on I2C. Low-voltage only; never touches mains.
#
# [VERIFY] I2C pins. GPIO21/GPIO22 are the ESP32 default and correct for a
#          healthy WROOM-32. Override per device if you wired the SHT4x to
#          other pins:  substitutions: { i2c_sda_pin: GPIO16, i2c_scl_pin: GPIO17 }
# [VERIFY] SHT41 I2C address 0x44 (fixed on the SHT4x family; 0x45 only on
#          the -B option part).
#
# Example use:
#   substitutions:
#     esphome_name: dehumidifier-controller
#     friendly_name: Dehumidifier Controller
#   packages:
#     board:   !include packages/board-esp32-sht41.yaml
#     network: !include packages/network.yaml

substitutions:
  model_name: "Wemos ESP32 + SHT41"
  # Control-loop / sensor sample cadence, and the plug re-assert cadence.
  sample_interval: "20s"
  i2c_sda_pin: GPIO21
  i2c_scl_pin: GPIO22

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    advanced:
      # The controller resolves the plug's address itself. An mDNS (.local)
      # lookup from an ESP is slow to *fail* (~5-15 s of retries) and runs on
      # the main loop — long enough to trip the task watchdog into a reboot
      # loop when the plug isn't reachable. Disable resolver mDNS so a .local
      # target fails fast; put the plug's IP in `s31_target`. (The controller
      # still ANNOUNCES itself — http://dehumidifier-controller.local from a
      # browser is unaffected.)
      enable_lwip_mdns_queries: false
    sdkconfig_options:
      # Belt and braces: a stalled http_request (unreachable plug, slow DNS)
      # must fail the command and move on, never panic-reboot. The plug has
      # its own stale-command watchdog for a genuinely dead controller.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"

i2c:
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

sensor:
  - platform: sht4x
    address: 0x44
    update_interval: ${sample_interval}
    temperature:
      name: "Temperature"
      id: sensor_temperature
    humidity:
      name: "Humidity"
      id: sensor_humidity

# HTTP client used to command the plug. url:/headers accept lambdas.
# timeout bounds the connect+transfer phase (not DNS — see the esp32 note above).
http_request:
  timeout: 3s
  useragent: dehumidifier-controller
