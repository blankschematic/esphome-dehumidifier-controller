name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Unpinned on purpose: this job is the "does it still work with current
      # ESPHome?" signal. Pin here if a release breaks and you need time to fix.
      - name: Install ESPHome
        run: pip install esphome

      - name: Provide placeholder secrets
        run: cp secrets.yaml.example secrets.yaml

      - name: Validate all configs
        run: |
          status=0
          for f in dehumidifier-*.yaml; do
            echo "::group::esphome config $f"
            esphome config "$f" || status=1
            echo "::endgroup::"
          done
          exit $status
