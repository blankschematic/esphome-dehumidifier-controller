name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — the point is to catch a secret in ANY commit

      # Run gitleaks straight from its container (MIT tool). The gitleaks
      # GitHub Action needs a paid licence key for org-owned repos; the binary
      # does not. Allowlist for secrets.yaml.example lives in .gitleaks.toml.
      - name: Scan history for committed secrets
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git . --config=/repo/.gitleaks.toml
          --redact --verbose --exit-code=1
